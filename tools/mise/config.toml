[settings]
experimental = true
env_cache = true
env_cache_ttl = "1h"

[settings.github]
credential_command = '$HOME/.local/share/mise/shims/gh auth token --hostname "$MISE_CREDENTIAL_HOST"'

[settings.npm]
package_manager = "pnpm"

[plugins]
proton = "~/.dotfiles/tools/mise/backend/proton"

[bootstrap.packages]
# -----
# macOS
# -----
# Casks
"brew-cask:brave-browser" = { version = "latest", os = "macos" }
"brew-cask:bruno" = { version = "latest", os = "macos" }
"brew-cask:ghostty" = { version = "latest", os = "macos" }
"brew-cask:font-jetbrains-mono-nerd-font" = { version = "latest", os = "macos" }
"brew-cask:ngrok" = { version = "latest", os = "macos" }
"brew-cask:orbstack" = { version = "latest", os = "macos" }
"brew-cask:raycast" = { version = "latest", os = "macos" }
# "brew-cask:tiny-cast" = { version = "latest", os = "macos" }
"brew-cask:ungoogled-chromium" = { version = "latest", os = "macos" }
"brew-cask:zen" = { version = "latest", os = "macos" }
# Formulae
"brew:bruno-cli" = { version = "latest", os = "macos" }
"brew:gpg-tui" = { version = "latest", os = "macos" }
"brew:mole" = { version = "latest", os = "macos" }
"brew:pinentry-mac" = { version = "latest", os = "macos" }
"brew:terminal-notifier" = { version = "latest", os = "macos" }

[tools]
go = { version = "1.27.3", os = ["macos"] }
lua = { version = "5.5.1", os = ["macos"] }
node = { version = "26.13.0", os = ["macos"] }
rust = { version = "1.99.1", os = ["macos"] }

# Managers
aqua = { version = "2.65.2", os = ["macos"] }
pnpm = { version = "12.16.1", os = ["macos"] }
uv = { version = "0.13.6", os = ["macos"] }

# CLIs
bat = { version = "0.26.1", os = ["macos"] }
bob = { version = "4.3.0", os = ["macos"] }
delta = { version = "0.20.1", os = ["macos"] }
difftastic = { version = "0.72.0", os = ["macos"] }
fastfetch = { version = "2.70.0", os = ["macos"] }
fd = { version = "10.5.0", os = ["macos"] }
fnox = { version = "1.45.0", workflow = "release.yml", os = ["macos"] }
fzf = { version = "0.74.5", os = ["macos"] }
gh = { version = "2.103.3", os = ["macos"] }
gitleaks = { version = "8.30.1", os = ["macos"] }
lazygit = { version = "0.66.2", os = ["macos"] }
lsd = { version = "1.2.0", os = ["macos"] }
mkcert = { version = "1.4.4", os = ["macos"] }
opencode = { version = "2.2.5", allow_builds = ["@opencode/cli"], os = ["macos"] }
ripgrep = { version = "15.2.0", os = ["macos"] }
ripgrep-all = { version = "0.10.10", os = ["macos"] }
starship = { version = "1.27.0", os = ["macos"] }
tokei = { version = "15.0.0", os = ["macos"] }
usage = { version = "7.1.4", workflow = "publish-cli.yml", os = ["macos"] }
yazi = { version = "26.9.1", os = ["macos"] }
zellij = { version = "0.45.1", os = ["macos"] }
zoxide = { version = "0.10.0", os = ["macos"] }
bottom = { version = "0.14.9", os = ["macos"] }
"aqua:cargo-bins/cargo-binstall" = { version = "1.26.1", os = ["macos"] }
"aqua:mfontanini/presenterm" = { version = "0.16.1", os = ["macos"] }
"aqua:bensadeh/tailspin" = { version = "7.0.0", os = ["macos"] }
"cargo:netscanner" = { version = "0.6.43", os = ["macos"] }
"github:FiloSottile/age" = { version = "1.3.2", os = ["macos"] }
"github:ulyssa/iamb" = { version = "0.13.1", os = ["macos"] }
"github:erickochen/purple" = { version = "3.32.1", os = ["macos"] }
"github:dalance/procs" = { version = "v0.14.12", os = ["macos"] }
"github:acheronfail/repgrep" = { version = "0.17.1", os = ["macos"] }
"github:unkn0wn-root/resterm" = { version = "1.17.2", bin = "resterm", os = ["macos"] }
"github:AmmarAbouZor/tui-journal" = { version = "0.18.0", os = ["macos"] }
"github:agavra/tuicr" = { version = "0.28.0", os = ["macos"] }

# MCPs
"pipx:serena-agent" = { version = "2.1.0", os = ["macos"] }
"npm:chrome-devtools-mcp" = { version = "1.12.0", os = ["macos"] }
"github:lightpanda-io/browser" = { version = "1.0.2", os = ["macos"] }

[env]
# OpenCode
OPENCODE_LOG_LEVEL = "debug"
OPENCODE_SERVER_HOSTNAME = "127.0.0.1"
OPENCODE_SERVER_PORT = "4096"

# Serena
SERENA_MCP_HOSTNAME = "127.0.0.1"
SERENA_MCP_PORT = "8000"
SERENA_UI_HOSTNAME = "127.0.0.1"
SERENA_UI_PORT = "24282"

[secrets.fnox]

[tasks."dash:serena"]
description = "Open Serena dashboard"
run = "open http://${SERENA_UI_HOSTNAME}:${SERENA_UI_PORT}"

[tasks."ai"]
description = "Start zellij with AI-related tools"
run = "zellij --layout ai"

[tasks.opencode]
description = "Start OpenCode coding AI agent attached to its server"
interactive = true
run = "fnox exec -- opencode --server=http://${OPENCODE_SERVER_HOSTNAME}:${OPENCODE_SERVER_PORT} ${OPENCODE_DIR:-.}"
alias = ["oc"]

[tasks."mcp:serena"]
description = "Start Serena MCP server"
run = "serena start-mcp-server --context=ide --transport=sse --host=${SERENA_UI_HOSTNAME} --port=${SERENA_MCP_PORT} 2>&1 | tspin"
alias = ["serena:start"]

[tasks."server:opencode"]
description = "Start OpenCode server"
run = "fnox exec -- opencode serve --print-logs --log-level=${OPENCODE_LOG_LEVEL} --hostname=${OPENCODE_SERVER_HOSTNAME} --port=${OPENCODE_SERVER_PORT} 2>&1 | tspin"
alias = ["dev:server:oc"]
