[settings]
experimental = true
env_cache = true
env_cache_ttl = "1h"

[settings.npm]
package_manager = "pnpm"

[bootstrap.packages]
# -----
# macOS
# -----
# Casks
"brew-cask:brave-browser" = { version = "latest", os = "macos" }
"brew-cask:bruno" = { version = "latest", os = "macos" }
"brew-cask:ghostty" = { version = "latest", os = "macos" }
"brew-cask:font-jetbrains-mono-nerd-font" = { version = "latest", os = "macos" }
"brew-cask:ngrok" = { version = "latest", os = "macos" }
"brew-cask:orbstack" = { version = "latest", os = "macos" }
"brew-cask:raycast" = { version = "latest", os = "macos" }
"brew-cask:ungoogled-chromium" = { version = "latest", os = "macos" }
"brew-cask:zen" = { version = "latest", os = "macos" }
# Formulae
"brew:bruno-cli" = { version = "latest", os = "macos" }
"brew:gpg-tui" = { version = "latest", os = "macos" }
"brew:mole" = { version = "latest", os = "macos" }
"brew:pinentry-mac" = { version = "latest", os = "macos" }
"brew:terminal-notifier" = { version = "latest", os = "macos" }

[tools]
go = "1.27.1"
node = "26.8.2"
rust = "1.98.1"

# Managers
aqua = { version = "2.62.3" }
pnpm = "12.4.1"
uv = "0.12.13"

# CLIs
bat = { version = "0.26.1" }
bob = { version = "4.1.7" }
delta = { version = "0.19.2" }
difftastic = { version = "0.70.0" }
fastfetch = "2.68.1"
fd = { version = "10.5.0" }
fzf = "0.74.4"
gh = "2.100.0"
lazygit = "0.65.0"
lsd = { version = "1.2.0" }
mkcert = { version = "1.4.4" }
opencode = "1.18.30"
ripgrep = { version = "15.2.0" }
ripgrep-all = { version = "0.10.10" }
starship = { version = "1.26.0" }
usage = "6.9.0"
yazi = "26.9.1"
zellij = "0.45.1"
zoxide = { version = "0.10.0" }
bottom = { version = "0.14.9" }
"aqua:cargo-bins/cargo-binstall" = "1.23.0"
"aqua:dalance/procs" = { version = "v0.14.12" }           # TODO: Migrate to mise registry when this PR is merged: https://github.com/jdx/mise/pull/12588
"cargo:iamb" = { version = "0.0.11" }
"cargo:cgrc" = { version = "2.0.6" }
"cargo:purple-ssh" = { version = "3.27.0" }

# MCPs
"pipx:serena-agent" = { version = "1.7.0" }
"npm:chrome-devtools-mcp" = { version = "1.9.0" }

[env]
# OpenCode
OPENCODE_HOSTNAME = "127.0.0.1"
OPENCODE_PORT = "4096"

# Serena
SERENA_MCP_HOSTNAME = "127.0.0.1"
SERENA_MCP_PORT = "8000"
SERENA_UI_HOSTNAME = "127.0.0.1"
SERENA_UI_PORT = "24282"

[tasks."dash:serena"]
description = "Open Serena dashboard"
run = "open http://${SERENA_UI_HOSTNAME}:${SERENA_UI_PORT}"

[tasks."dev:ai"]
description = "Start zellij with AI-related tools"
run = "zellij --layout ai"

[tasks."dev:server:opencode"]
description = "Start OpenCode server"
run = "opencode serve --hostname ${OPENCODE_HOSTNAME} --port ${OPENCODE_PORT}"
alias = ["dev:server:oc"]

[tasks."mcp:serena"]
description = "Start Serena MCP server"
run = "serena start-mcp-server --context ide --transport sse --host ${SERENA_UI_HOSTNAME} --port ${SERENA_MCP_PORT} 2>&1 | cgrc --conf-path ${XDG_CONFIG_HOME}/cgrc/conf.serena"
alias = ["serena:start"]

[tasks.opencode]
description = "Start OpenCode coding AI agent attached to its server"
run = "opencode attach http://${OPENCODE_HOSTNAME}:${OPENCODE_PORT} --dir ${OPENCODE_DIR:-.}"
alias = ["oc"]
